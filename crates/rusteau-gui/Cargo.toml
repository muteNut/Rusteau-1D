[package]
name = "rusteau-gui"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"


[[bin]]
name = "rusteau"
path = "src/main.rs"

[dependencies]
rusteau-core = { path = "../rusteau-core" }
rusteau-io = { path = "../rusteau-io" }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11"] }
egui = "0.31"
egui_plot = "0.31"
egui_extras = "0.31"
# PNG images of the help and the figures (already a dependency of eframe)
image = { version = "0.25", default-features = false, features = ["png"] }
# figures: anti-aliased rasterizing; glyph outlines and font names (both already dependencies of egui)
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2"
ttf-parser = "0.25"
# figures and kept runs stored as JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"
