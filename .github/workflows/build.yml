name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Actions → build → Run workflow: build the selected branch and publish it as the release of a new tag
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to publish, e.g. v1.3 (created on the selected branch)"
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS: one program for Apple Silicon and Intel
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev
      - name: Test engine
        run: cargo test -p rusteau-core --release
      - name: Test interface (help, tooltips)
        run: cargo test -p rusteau-gui --release
      - name: Build release binaries
        if: runner.os != 'macOS'
        run: cargo build --release -p rusteau-gui -p rusteau-cli
      - name: Build release binaries (macOS, Apple Silicon and Intel)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin -p rusteau-gui -p rusteau-cli
          cargo build --release --target x86_64-apple-darwin -p rusteau-gui -p rusteau-cli
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist && cp target/release/rusteau target/release/rusteau-cli dist/
          cp -r docs/help dist/help
          mkdir dist/fonts && cp crates/rusteau-gui/fonts/OFL-*.txt crates/rusteau-gui/fonts/README.md dist/fonts/
          tar czf rusteau-linux-x86_64.tar.gz -C dist .
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist
          copy target\release\rusteau.exe dist\
          copy target\release\rusteau-cli.exe dist\
          Copy-Item -Recurse docs\help dist\help
          New-Item -ItemType Directory dist\fonts
          Copy-Item crates\rusteau-gui\fonts\OFL-*.txt, crates\rusteau-gui\fonts\README.md dist\fonts\
          Compress-Archive -Path dist\* -DestinationPath rusteau-windows-x86_64.zip
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: sh tools/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rusteau-${{ runner.os }}
          path: |
            rusteau-linux-x86_64.tar.gz
            rusteau-windows-x86_64.zip
            rusteau-macos-universal.zip
          if-no-files-found: error

  # a tag v… (pushed, or given to Run workflow): publish the release with the archives of all systems (only when every
  # build succeeded)
