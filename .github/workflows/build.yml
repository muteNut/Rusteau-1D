name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev
      - name: Test engine
        run: cargo test -p rusteau-core --release
      - name: Test interface (help, tooltips)
        run: cargo test -p rusteau-gui --release
      - name: Build release binaries
        run: cargo build --release -p rusteau-gui -p rusteau-cli
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist && cp target/release/rusteau target/release/rusteau-cli dist/
          cp -r docs/help dist/help
          tar czf rusteau-linux-x86_64.tar.gz -C dist .
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist
          copy target\release\rusteau.exe dist\
          copy target\release\rusteau-cli.exe dist\
          Copy-Item -Recurse docs\help dist\help
          Compress-Archive -Path dist\* -DestinationPath rusteau-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rusteau-${{ runner.os }}
          path: |
            rusteau-linux-x86_64.tar.gz
            rusteau-windows-x86_64.zip
          if-no-files-found: ignore
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rusteau-linux-x86_64.tar.gz
            rusteau-windows-x86_64.zip
